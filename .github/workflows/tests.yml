name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install pinned dependencies
        run: pip install -r backend/requirements-lock.txt
      - name: Run the test suite (offline; no API keys needed)
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Generated docs match the code
        working-directory: backend
        run: |
          python -m services.ranking_doc
          python -m frameworks.export_doc
          git diff --exit-code -- ../docs/RANKING.md ../docs/FRAMEWORKS.md

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
