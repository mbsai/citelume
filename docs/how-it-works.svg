<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How CiteLume works</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .step{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .src{fill:#f0fdf4;stroke:#22c55e;stroke-width:1.5}
      .out{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
      .side{fill:#faf5ff;stroke:#a855f7;stroke-width:1.5;stroke-dasharray:5 4}
      .gate{fill:#fef2f2;stroke:#ef4444;stroke-width:1.5}
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .n{font-size:12px;font-weight:700;fill:#4f46e5}
      .h{font-size:13px;font-weight:700;fill:#64748b;letter-spacing:1px}
      .ln{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dl{stroke:#a855f7;stroke-width:1.4;fill:none;stroke-dasharray:4 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1000" height="760" fill="#f8fafc"/>
  <text x="30" y="40" font-size="22" font-weight="800" fill="#0f172a">How CiteLume works</text>
  <text x="30" y="62" class="s">From a research question to a cited, verified literature review: every step degrades gracefully, down to rule-based extraction with no LLM.</text>

  <!-- 1 Question -->
  <rect class="box" x="30" y="90" width="190" height="78" rx="12"/>
  <text x="46" y="115" class="t">Your question</text>
  <text x="46" y="136" class="s">Standard (≤20 studies) or</text>
  <text x="46" y="152" class="s">Deep Research (≤60 studies)</text>

  <!-- 2 Understand -->
  <rect class="step" x="260" y="90" width="210" height="78" rx="12"/>
  <text x="276" y="112" class="n">1</text><text x="292" y="112" class="t">Parse the question</text>
  <text x="276" y="134" class="s">Domain, key concepts, required</text>
  <text x="276" y="150" class="s">place / population, review type</text>

  <!-- 3 Plan -->
  <rect class="step" x="510" y="90" width="210" height="78" rx="12"/>
  <text x="526" y="112" class="n">2</text><text x="542" y="112" class="t">Plan the searches</text>
  <text x="526" y="134" class="s">Sub-questions, and a query</text>
  <text x="526" y="150" class="s">written for each database</text>

  <line class="ln" x1="220" y1="129" x2="258" y2="129"/>
  <line class="ln" x1="470" y1="129" x2="508" y2="129"/>

  <!-- Sources -->
  <text x="760" y="88" class="h">LITERATURE SOURCES</text>
  <rect class="src" x="760" y="98" width="210" height="34" rx="8"/><text x="772" y="120" class="s"><tspan font-weight="700">PubMed</tspan> → Europe PMC if down</text>
  <rect class="src" x="760" y="138" width="210" height="34" rx="8"/><text x="772" y="160" class="s"><tspan font-weight="700">arXiv</tspan>  ·  <tspan font-weight="700">bioRxiv / medRxiv</tspan></text>
  <rect class="src" x="760" y="178" width="210" height="34" rx="8"/><text x="772" y="200" class="s"><tspan font-weight="700">Semantic Scholar</tspan> → OpenAlex</text>
  <rect class="src" x="760" y="218" width="210" height="34" rx="8"/><text x="772" y="240" class="s"><tspan font-weight="700">Hugging Face Hub</tspan> (models, data)</text>
  <line class="ln" x1="720" y1="129" x2="758" y2="129"/>

  <!-- 3 Merge -->
  <rect class="step" x="510" y="290" width="210" height="96" rx="12"/>
  <text x="526" y="312" class="n">3</text><text x="542" y="312" class="t">Merge, rank, screen</text>
  <text x="526" y="334" class="s">Remove duplicates, drop studies</text>
  <text x="526" y="350" class="s">outside the place/population,</text>
  <text x="526" y="366" class="s">screen each study for relevance</text>
  <path class="ln" d="M865,252 L865,272 L615,272 L615,288"/>

  <!-- 4 Full text -->
  <rect class="step" x="260" y="290" width="210" height="96" rx="12"/>
  <text x="276" y="312" class="n">4</text><text x="292" y="312" class="t">Read open full text</text>
  <text x="276" y="334" class="s">Europe PMC, bioRxiv, arXiv and</text>
  <text x="276" y="350" class="s">open PDFs; abstract otherwise.</text>
  <text x="276" y="366" class="s">Methods, results, limitations</text>
  <line class="ln" x1="510" y1="338" x2="472" y2="338"/>

  <!-- 5 Extract -->
  <rect class="step" x="30" y="290" width="190" height="96" rx="12"/>
  <text x="46" y="312" class="n">5</text><text x="62" y="312" class="t">Extract each study</text>
  <text x="46" y="334" class="s">Design, sample, results,</text>
  <text x="46" y="350" class="s">limitations, stance; small</text>
  <text x="46" y="366" class="s">batches for small models</text>
  <line class="ln" x1="260" y1="338" x2="222" y2="338"/>

  <!-- 6 Claims & synthesis -->
  <rect class="step" x="30" y="430" width="440" height="80" rx="12"/>
  <text x="46" y="452" class="n">6</text><text x="62" y="452" class="t">Build claims and write the synthesis</text>
  <text x="46" y="474" class="s">Findings grouped into claims with supporting and opposing studies.</text>
  <text x="46" y="490" class="s">Deep Research writes the review section by section.</text>
  <line class="ln" x1="125" y1="386" x2="125" y2="428"/>

  <!-- Gate -->
  <rect class="gate" x="510" y="430" width="210" height="80" rx="12"/>
  <text x="526" y="452" class="n">7</text><text x="542" y="452" class="t">Verification gates</text>
  <text x="526" y="474" class="s">Every [n] must be a real study;</text>
  <text x="526" y="490" class="s">every number must be in its source</text>
  <line class="ln" x1="470" y1="470" x2="508" y2="470"/>

  <!-- Side: frameworks + LLM -->
  <rect class="side" x="760" y="290" width="210" height="96" rx="12"/>
  <text x="776" y="312" class="t">Methods rules</text><text x="890" y="312" class="s" fill="#7e22ce">→ steps 5–7</text>
  <text x="776" y="334" class="s">RoB 2, ROBINS, QUADAS-3,</text>
  <text x="776" y="350" class="s">PROBAST+AI, GRADE, PRISMA,</text>
  <text x="776" y="366" class="s">SWiM, REFORMS… by domain</text>

  <rect class="side" x="760" y="400" width="210" height="110" rx="12"/>
  <text x="776" y="422" class="t">LLM layer</text><text x="862" y="422" class="s" fill="#7e22ce">→ steps 1, 2, 5, 6</text>
  <text x="776" y="444" class="s">Any provider or local model;</text>
  <text x="776" y="460" class="s">backup models, retries and a</text>
  <text x="776" y="476" class="s">circuit breaker. If it fails:</text>
  <text x="776" y="492" class="s">rule-based extraction</text>

  <!-- Outputs -->
  <text x="30" y="532" class="h">WHAT YOU GET</text>
  <line class="ln" x1="615" y1="510" x2="615" y2="540"/>
  <line x1="115" y1="540" x2="884" y2="540" stroke="#64748b" stroke-width="1.6"/>
  <g>
    <rect class="out" x="30" y="570" width="170" height="92" rx="12"/>
    <text x="44" y="594" class="t">Synthesis</text>
    <text x="44" y="616" class="s">Cited answer or review,</text>
    <text x="44" y="632" class="s">consensus meter, PRISMA</text>
    <text x="44" y="648" class="s">flow, bibliography</text>
    <line class="ln" x1="115" y1="540" x2="115" y2="568"/>

    <rect class="out" x="222" y="570" width="170" height="92" rx="12"/>
    <text x="236" y="594" class="t">Evidence table</text>
    <text x="236" y="616" class="s">Per-study design, sample,</text>
    <text x="236" y="632" class="s">results and appraisal;</text>
    <text x="236" y="648" class="s">full text marked</text>
    <line class="ln" x1="307" y1="540" x2="307" y2="568"/>

    <rect class="out" x="414" y="570" width="170" height="92" rx="12"/>
    <text x="428" y="594" class="t">Knowledge gaps</text>
    <text x="428" y="616" class="s">Author-stated open</text>
    <text x="428" y="632" class="s">questions, missing study</text>
    <text x="428" y="648" class="s">designs, disagreements</text>
    <line class="ln" x1="499" y1="540" x2="499" y2="568"/>

    <rect class="out" x="606" y="570" width="170" height="92" rx="12"/>
    <text x="620" y="594" class="t">Literature network</text>
    <text x="620" y="616" class="s">Citation links and topic</text>
    <text x="620" y="632" class="s">clusters; expand any</text>
    <text x="620" y="648" class="s">paper's neighbours</text>
    <line class="ln" x1="691" y1="540" x2="691" y2="568"/>

    <rect class="out" x="798" y="570" width="172" height="92" rx="12"/>
    <text x="812" y="594" class="t">Exports</text>
    <text x="812" y="616" class="s">Markdown, text, PDF,</text>
    <text x="812" y="632" class="s">CSV, JSON, GraphML</text>
    <line class="ln" x1="884" y1="540" x2="884" y2="568"/>
  </g>

  <!-- Demo band -->
  <rect x="30" y="690" width="940" height="46" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="46" y="711" class="s"><tspan font-weight="700">Public demo:</tspan> shared NVIDIA free models via OpenRouter, 3 Standard + 1 Deep Research run per IP address per day.</text>
  <text x="46" y="727" class="s">Bring your own LLM key for unlimited use, or run it locally / with Docker, where no limits apply.</text>
</svg>
